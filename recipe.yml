/* Canonical recipe, expanded per image by scripts/gen-recipe.sh (cpp).
   Knobs (-D): IMAGE_NAME, BASE_IMAGE, NV580, NOVIDIA.
   Pitfall: a slash followed by a star inside a path opens a C comment,
   so quote such globs, e.g. "/tmp/*". */
#ifndef IMAGE_NAME
#define IMAGE_NAME vanilla-cherry
#endif
#ifndef BASE_IMAGE
#define BASE_IMAGE ghcr.io/vanilla-os/gnome:latest
#endif
name: IMAGE_NAME
id: IMAGE_NAME
vibversion: 1.1.0

stages:
- id: build
  base: BASE_IMAGE
  singlelayer: false
  addincludes: true
  labels:
    maintainer: JustSaft
  args:
    DEBIAN_FRONTEND: noninteractive
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends
  cleanup:
    - /boot/initrd.img*
    - "/tmp/*"
    - /var/cache/apt/pkgcache.bin
    - /var/cache/debconf
    - /var/cache/dictionaries-common
    - /var/cache/fontconfig
    - /var/cache/ldconfig
    - /var/cache/man
    - /var/lib/dbus/machine-id
    - "/var/log/*"

  modules:
  - name: init-setup
    type: shell
    commands:
      - lpkg --unlock
      - echo 'PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games"' >> /etc/environment
      - sed -i '4,10d' /etc/profile
      - apt update
      - apt clean
      - apt-mark hold snapd gnome-software-plugin-snap
      - apt -y install squashfs-tools minisign

  - name: mystuff
    type: includes
    includes:
#if defined(NOVIDIA)
#elif defined(NV580)
      - modules/50-nvidia-580-driver-install.yml
#else
      - gh:vanilla-os/nvidia-exp-image:dev:modules/50-nvidia-driver-install.yml
#endif
      - modules/600-utils.yml
      - modules/601-audio.yml
      - modules/604-evremap.yml
      - modules/620-gaming.yml
      - modules/624-openrgb-v2.yml
      - modules/625-syncthing.yml
      - modules/628-tailscale.yml
      - modules/629-lact.yml
      - modules/700-gs-customization.yml
      - modules/999-cleanup.yml

  - name: cleanup-and-sysconf-setup
    type: shell
    commands:
      - SUDO_FORCE_REMOVE=yes apt purge -y sudo
      - apt autoremove -y
      - apt clean
      - lpkg --lock
      - rsync -a /etc/ /sysconf/
    cleanup:
      - /sysconf/resolv.conf


- id: initrd
  base: build
  runs:
    commands:
      - touch $(readlink -f /initrd.img)