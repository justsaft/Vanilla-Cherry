[Service]
# The image can ship without SSH host keys, which makes "sshd -t" fail and
# sends ssh.service into a start-limit-hit crash loop.
# ssh-keygen -A only creates keys that are missing, so this is safe to run on
# every start. It has to run before the stock "sshd -t" check, so reset the
# list and re-add both in order.
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
