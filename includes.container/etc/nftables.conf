#!/usr/sbin/nft -f

# Only reset our own table. A global "flush ruleset" would also delete the
# chains that Tailscale, podman and iptables-nft create on reload/restart.
table inet filter
delete table inet filter

table inet filter {

    chain input {
        type filter hook input priority filter;
        policy drop;

        meta iif lo accept

        ct state established, related accept

        # ICMP/ICMPv6: IPv6 neighbor discovery and router advertisements
        # are ICMPv6 and need to pass, otherwise IPv6 breaks. Also allows ping.
        meta l4proto { icmp, ipv6-icmp } accept

        # Tailscale controlplane (direct peer connections)
        udp dport 41641 accept

        # Tailscale interface (this is also how SSH is reached).
        # iifname matches the name as a string at packet time. iif would pin
        # the interface index at load time, which fails if tailscale0 does not
        # exist yet when nftables.service starts and goes stale when
        # tailscaled recreates the interface.
        iifname "tailscale0" accept

        # KDE Connect
        meta l4proto { tcp, udp } th dport 1714-1764 accept

        # log prefix "NFT_DROP: " counter
    }

    chain forward {
        type filter hook forward priority filter;
        policy accept;
        # Left open on purpose: Tailscale subnet routing/exit node and
        # container networking need forwarding.
        # log prefix "NFT_FORWARD: " counter
    }

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}

# --- Policy Summary ---
# INPUT:   DROP by default, EXCEPT loopback, established/related traffic,
#          ICMP/ICMPv6, Tailscale (control port + tailscale0) and KDE Connect.
#          SSH is only reachable through tailscale0.
# FORWARD: ACCEPT (routing allowed, see chain comment).
# OUTPUT:  ACCEPT (can initiate connections freely).
