name: 'VIB Image Build'

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  workflow_dispatch:
  pull_request:

jobs:
  image:
    name: ${{ matrix.variant.name }}
    strategy:
      fail-fast: false
      matrix:
        # One entry per image. Add a line here to add an image.
        variant:
          # "defines" are extra cpp flags for scripts/gen-recipe.sh,
          # e.g. -DNV580 or -DBASE_IMAGE=ghcr.io/vanilla-os/core:latest
          - { name: default, image: vanilla-cherry,         defines: "" }
          - { name: nv580,   image: vanilla-cherry-nv580,   defines: "-DNV580" }
          - { name: novidia, image: vanilla-cherry-novidia, defines: "-DNOVIDIA" }
    # A called workflow can only use permissions granted here.
    permissions:
      contents: write # Allow actions to create a digest
      packages: write # Allow pushing images to GHCR
      attestations: write # To create and write attestations
      id-token: write # Additional permissions for the persistence of the attestations
    uses: ./.github/workflows/vib-build.yml
    secrets:
      MOK_KEY: ${{ secrets.MOK_KEY }}
      MOK_CERT: ${{ secrets.MOK_CERT }}
    with:
      name: ${{ matrix.variant.name }}
      image: ${{ matrix.variant.image }}
      defines: ${{ matrix.variant.defines }}