name: 'Build one VIB image (reusable)'

on:
  workflow_call:
    inputs:
      name:
        description: Short variant name; used in artifact names. Must be unique per run.
        type: string
        required: true
      image:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      defines:
        description: Extra cpp flags for scripts/gen-recipe.sh (e.g. -DNV580)
        type: string
        default: ''
    secrets:
      MOK_KEY:
        description: PEM private key that signs the NVIDIA kernel modules
        required: false
      MOK_CERT:
        description: PEM certificate that matches MOK_KEY, enrolled by users
        required: false

env:
  CUSTOM_IMAGE_NAME: ${{ inputs.image }}
  # Generated from recipe.in.yml; lives next to modules/ so relative includes resolve.
  RECIPE: out.recipe-${{ inputs.name }}.yml
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  GH_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  check_update:
    runs-on: ubuntu-latest

    outputs:
      has_updates: ${{ steps.set_output.outputs.has_updates }}
      base_image: ${{ steps.read_base_recipe.outputs.base_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y -qq --no-install-recommends jq skopeo libfyaml-utils

      - name: Generate recipe
        env:
          DEFINES: ${{ inputs.defines }}
        run: sh scripts/gen-recipe.sh "$RECIPE" -DIMAGE_NAME="$CUSTOM_IMAGE_NAME" $DEFINES

      # Kept so the generated recipe can be downloaded and diffed afterwards.
      - name: Upload generated recipe
        uses: actions/upload-artifact@v7
        with:
          name: generated-recipe-${{ inputs.name }}
          path: ${{ env.RECIPE }}

      - name: Read base image name from recipe
        id: read_base_recipe
        run: |
          # Stage 0 is the one built FROM the registry image; later stages
          # (if any) use "base: <stage id>", which isn't a pullable image.
          BASE_IMAGE="$(fy-filter -f "$RECIPE" /stages/0/base)"
          echo The base image is $BASE_IMAGE
          if [ -z $BASE_IMAGE ]; then exit 1; fi
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Get last successful run
        if: ${{ github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh run list -b "${{ github.ref_name }}" -w "${{ github.workflow }}" -s "success" -L 1 --json databaseId > last_run.json
          echo "LAST_RUN_ID=$(jq -r '.[0].databaseId' last_run.json)" >> "$GITHUB_ENV"

      - name: Download the previous digest
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: digest-${{ inputs.name }}
          github-token: ${{ github.token }}
          run-id: ${{ env.LAST_RUN_ID }}

      - name: Check if there was an update to the base image
        run: |
          touch digest.txt
          mv digest.txt last_digest.txt
          skopeo inspect --raw docker://${{ env.BASE_IMAGE }} | sha256sum > digest.txt
          echo Old digest is: $(cat last_digest.txt)
          echo New digest is: $(cat digest.txt)
          echo "HAS_UPDATES=$(cmp -s digest.txt last_digest.txt; echo $?)" >> "$GITHUB_ENV"

      - name: Upload current digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.name }}
          path: digest.txt

      - name: Set output
        id: set_output
        run: |
          if [ ${{ github.event_name == 'schedule'}} == false ]
          then
            echo action was manually run, updating either way
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          elif [ ${{ env.HAS_UPDATES }} == 1 ]
          then
            echo base image was updated since the last build
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo no updates to the base image since the last build
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  verify_base_image:
    runs-on: ubuntu-latest
    needs:
      - check_update

    steps:
    - name: Verify Base Image Integrity
      run: gh attestation verify oci://${{ needs.check_update.outputs.base_image }} --owner Vanilla-OS
      env:
        GH_TOKEN: ${{ github.token }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs:
      - verify_base_image
      - check_update

    steps:
    - uses: actions/checkout@v7

    - name: Generate recipe
      env:
        DEFINES: ${{ inputs.defines }}
      run: sh scripts/gen-recipe.sh "$RECIPE" -DIMAGE_NAME="$CUSTOM_IMAGE_NAME" $DEFINES

    - name: Check base image architecture support
      run: |
        BASE_IMAGE="${{ needs.check_update.outputs.base_image }}"
        TARGET_ARCH="${{ matrix.arch }}"
        echo "Checking if $BASE_IMAGE supports the $TARGET_ARCH architecture..."
        MANIFEST=$(skopeo inspect --raw docker://$BASE_IMAGE | jq -r '.')

        if echo "$MANIFEST" | jq -e '.manifests' > /dev/null 2>&1; then
          if echo "$MANIFEST" | jq -e ".manifests[] | select(.platform.architecture==\"$TARGET_ARCH\")" > /dev/null 2>&1; then
            echo "Base image supports $TARGET_ARCH architecture. Continuing"
          else
            echo "Base image does NOT support $TARGET_ARCH architecture. Stopping here."
            echo "Supported architectures:"
            echo "$MANIFEST" | jq -r '.manifests[].platform.architecture' | sort | uniq
            exit 1
          fi
        else
          IMAGE_ARCH=$(echo "$MANIFEST" | jq -r '.architecture')
          if [ "$IMAGE_ARCH" = "null" ]; then
            IMAGE_ARCH="amd64"
            echo "Architecture field is null, assuming amd64"
          fi
          if [ "$IMAGE_ARCH" = "$TARGET_ARCH" ]; then
            echo "Base image supports $TARGET_ARCH architecture. Continuing"
          else
            echo "Base image only supports $IMAGE_ARCH, but we're building for $TARGET_ARCH. Stopping here"
            exit 1
          fi
        fi

    - uses: vanilla-os/vib-gh-action@main
      with:
        recipe: ${{ env.RECIPE }}
        plugins: 'Vanilla-OS/vib-fsguard:v1.6.1'
        output: 'Containerfile-${{ inputs.name }}'

    # Signs the NVIDIA modules when the image has them. The private key only
    # reaches the build as a BuildKit secret, so it never ends up in a layer.
    # Pushes without both secrets fail so that unsigned images are not published.
    - name: Prepare NVIDIA module signing
      id: signing
      if: ${{ !contains(inputs.defines, 'NOVIDIA') }}
      env:
        MOK_KEY: ${{ secrets.MOK_KEY }}
        MOK_CERT: ${{ secrets.MOK_CERT }}
        PUSHING: ${{ github.event_name != 'pull_request' }}
      run: |
        if [ -z "$MOK_KEY" ] || [ -z "$MOK_CERT" ]; then
          if [ "$PUSHING" = true ]; then
            echo "::error::Secrets MOK_KEY and MOK_CERT are required to publish an image with NVIDIA modules"
            exit 1
          fi
          echo "::warning::MOK_KEY or MOK_CERT is not available, this build leaves the NVIDIA modules unsigned"
          exit 0
        fi
        umask 077
        printf '%s\n' "$MOK_KEY" > "$RUNNER_TEMP/mok_key"
        printf '%s\n' "$MOK_CERT" > "$RUNNER_TEMP/mok_cert"
        fingerprint="$(openssl x509 -in "$RUNNER_TEMP/mok_cert" -noout -fingerprint -sha256 | cut -d= -f2)"
        sh scripts/inject-build-secrets.sh "Containerfile-${{ inputs.name }}" "$fingerprint"
        echo "secret_files=mok_key=$RUNNER_TEMP/mok_key,mok_cert=$RUNNER_TEMP/mok_cert" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      with:
        name: Containerfile-${{ inputs.name }}-${{ matrix.arch }}
        path: Containerfile-${{ inputs.name }}
        overwrite: true

    - name: Generate image name
      run: |
        REPO_OWNER_LOWERCASE="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
        echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
        echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/$CUSTOM_IMAGE_NAME" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_URL }}
        tags: |
          type=raw,value=${{ env.GH_BRANCH_NAME }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Package Registry
      uses: docker/login-action@v4
      if: ${{ github.event_name != 'pull_request' }}
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # NOTE: this pushes the per-arch image BY DIGEST ONLY (no tag). The
    # actual tag (e.g. "main") is only created once, in the merge job below,
    # once every arch's digest has been collected. This is what prevents
    # the amd64 and arm64 legs from racing to overwrite the same tag.
    #
    # The cache scope is per variant and arch so the parallel builds don't
    # evict each other's layers from the shared GitHub Actions cache.
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Containerfile-${{ inputs.name }}
        secret-files: ${{ steps.signing.outputs.secret_files }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}-${{ matrix.arch }}
        platforms: linux/${{ matrix.arch }}
        provenance: false
        outputs: type=image,name=${{ env.IMAGE_URL }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

    - name: Remove signing secrets
      if: ${{ always() }}
      run: rm -f "$RUNNER_TEMP/mok_key" "$RUNNER_TEMP/mok_cert"

    - name: Attest pushed image
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/attest-build-provenance@v3
      id: attest
      with:
        subject-name: ${{ env.IMAGE_URL }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: false

    - name: Export digest
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ inputs.name }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.name }}-*
          merge-multiple: true

      - name: Generate image name
        run: |
          REPO_OWNER_LOWERCASE="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/$CUSTOM_IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_URL }}
          tags: |
            type=raw,value=${{ env.GH_BRANCH_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This is the step that actually creates the multi-arch manifest list
      # under the real tag (e.g. "main"), pointing at both per-arch digests.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_URL }}@sha256:%s ' *)

      - name: Inspect merged image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_URL }}:${{ env.GH_BRANCH_NAME }}