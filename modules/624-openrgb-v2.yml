#define PLUGIN_APT_INSTALL(ORGB_PLUGIN, ORGB_PLUGIN_COMMIT) apt install -y -qq --no-install-recommends /sources/openrgb-install-plugins/OpenRGB@@ORGB_PLUGIN@@_@@ORGB_VERSION@@_Trixie_${ARCH}_@@ORGB_PLUGIN_COMMIT/openrgb-install-plugins.deb

  commands:
    - mkdir -p /usr/lib/openrgb
    - mkdir -p /usr/lib/openrgb/plugins
    - rm -rf "/usr/lib/openrgb/plugins/*"
    - ARCH=$(dpkg --print-architecture)
    - PLUGIN_APT_INSTALL(EffectsPlugin,EFFECTS_PL_COMMIT)
    - PLUGIN_APT_INSTALL(VisualMapPlugin,VISUALMAP_PL_COMMIT)
    - PLUGIN_APT_INSTALL(HardwareSyncPlugin,HARDWARESYNC_PL_COMMIT)
    - PLUGIN_APT_INSTALL(E131RecieverPlugin,E131_PL_COMMIT)
    - PLUGIN_APT_INSTALL(HttpHookPlugin,HTTP_PL_COMMIT)
    - PLUGIN_APT_INSTALL(SchedulerPlugin,SCHEDULER_PL_COMMIT)
