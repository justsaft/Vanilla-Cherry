name: openrgb-install
type: shell
sources:
- type: file
  _COMMENT(https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.0/openrgb_1.0_amd64_trixie_81bbe18.deb)
  url: ORGB_URL(amd64)
  checksum: 51f8b4f5260207569fdeda9e1b9dd0bd2d02af2b30e068f7c79471e7f53e36f8
  only-arches: [amd64]
- type: file
  _COMMENT(https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.0/openrgb_1.0_arm64_trixie_81bbe18.deb)
  url: ORGB_URL(arm64)
  checksum: 713b1495e1bbb9fcb7040f48c3c637979c9bbbd827237fb63f40bba0ae8ff7ac
  only-arches: [arm64]
commands:
  - apt-get install -y /sources/openrgb-install/openrgb_@@ORGB_VERSION@@_$(dpkg --print-architecture)_@@ORGB_RELEASE_DISTRO@@_@@OPENRGB_COMMIT/openrgb-install.deb

modules:
