
#include "../macros.h"

#define OPENRGB_COMMIT 81bbe18
#define EFFECTS_PL_COMMIT 0e0f1b4
#define VISUALMAP_PL_COMMIT 1dde279
#define HARDWARESYNC_PL_COMMIT d999417
#define E131_PL_COMMIT 4900d20

#define ORGB_BASE_URL https://codeberg.org/OpenRGB/OpenRGB
#define ORGB_RELEASE_URL releases/download/release
#define ORGB_VERSION 1.0

#define ORGB_URL(ARCH) ORGB_BASE_URL@@/ORGB_RELEASE_URL@@_@@ORGB_VERSION/OpenRGB_@@ORGB_VERSION@@_@@ARCH@@_@@trixie@@_@@OPENRGB_COMMIT.deb

#define ORGB_PLUGIN_URL(ARCH, ORGB_PLUGIN_NAME, ORGB_PLUGIN_COMMIT) ORGB_BASE_URL@@ORGB_PLUGIN_NAME@@/ORGB_RELEASE_URL@@_@@ORGB_VERSION/OpenRGB@@ORGB_PLUGIN_NAME@@_@@ORGB_VERSION@@_@@ARCH@@_@@Trixie@@_@@ORGB_PLUGIN_COMMIT.deb

name: openrgb-install
type: shell
sources:
- type: file
  _COMMENT(https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.0/openrgb_1.0_amd64_trixie_81bbe18.deb)
  url: ORGB_URL(amd64)
  checksum: 51f8b4f5260207569fdeda9e1b9dd0bd2d02af2b30e068f7c79471e7f53e36f8
  only-arches: [amd64]
- type: file
  _COMMENT(https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.0/openrgb_1.0_arm64_trixie_81bbe18.deb)
  url: ORGB_URL(arm64)
  checksum: 713b1495e1bbb9fcb7040f48c3c637979c9bbbd827237fb63f40bba0ae8ff7ac
  only-arches: [arm64]
commands:
  - apt-get install -y /sources/openrgb-install/openrgb_@@ORGB_VERSION@@_$(dpkg --print-architecture)_@@ORGB_DISTRO_RELEASE@@_@@OPENRGB_COMMIT/openrgb-install.deb

modules:
- name: openrgb-install-deps
  type: apt
  sources:
    - packages:
      - i2c-tools

#define PLUGIN_APT_INSTALL(ORGB_PLUGIN, ORGB_PLUGIN_COMMIT) apt install -y -qq --no-install-recommends /sources/openrgb-install-plugins/OpenRGB@@ORGB_PLUGIN@@_@@ORGB_VERSION@@_Trixie_${ARCH}_@@ORGB_PLUGIN_COMMIT.deb

- name: openrgb-install-plugins
  type: shell
  sources:
    # EffectsPlugin
    - type: file
      _COMMENT(https://codeberg.org/OpenRGB/OpenRGBEffectsPlugin/releases/download/release_1.0/OpenRGBEffectsPlugin_1.0_Trixie_amd64_0e0f1b4.deb)
      url: ORGB_PLUGIN_URL(amd64,EffectsPlugin,EFFECTS_PL_COMMIT)
      checksum: d5c6b587bafe89eab419e692c5ab59ea6723dfa110c307c0e6942563fcae5d83
      only-arches: [amd64]
    - type: file
      url: ORGB_PLUGIN_URL(arm64,EffectsPlugin,EFFECTS_PL_COMMIT)
      checksum: 3426108849c7f9e666eb697b2d9111899b62a9b02fc3828f99e465e779da1b36
      only-arches: [arm64]

    # VisualMapPlugin
    - type: file
      _COMMENT(https://codeberg.org/OpenRGB/OpenRGBVisualMapPlugin/releases/download/release_1.0/OpenRGBVisualMapPlugin_1.0_Trixie_amd64_1dde279.deb)
      url: ORGB_PLUGIN_URL(amd64,VisualMapPlugin,VISUALMAP_PL_COMMIT)
      checksum: 359ed9d9dc9f5138333d1bf0c0bab1e99154988a63582653622cb779b3893024
      only-arches: [amd64]
    - type: file
      url: ORGB_PLUGIN_URL(arm64,VisualMapPlugin,VISUALMAP_PL_COMMIT)
      checksum: d7feca494c63d265379c10b015de32632b1d09b30195acf0a231abbd5283f3ce
      only-arches: [arm64]

    # HardwareSyncPlugin
    - type: file
      _COMMENT(https://codeberg.org/OpenRGB/OpenRGBHardwareSyncPlugin/releases/download/release_1.0/OpenRGBHardwareSyncPlugin_1.0_Trixie_amd64_d999417.deb)
      url: ORGB_PLUGIN_URL(amd64,HardwareSyncPlugin,HARDWARESYNC_PL_COMMIT)
      checksum: 1ff0b969a84f24c906e137c494a8b70e6e1897bbc24fa97092c1a07536f60fda
      only-arches: [amd64]
    - type: file
      url: ORGB_PLUGIN_URL(amd64,HardwareSyncPlugin,HARDWARESYNC_PL_COMMIT)
      checksum: 34c6815321829363b120f97c71a0662136e728f1763514aa72a84d6029ad00b4
      only-arches: [arm64]

    # E131RecieverPlugin
    - type: file
      _COMMENT(https://codeberg.org/OpenRGB/OpenRGBE131ReceiverPlugin/releases/download/release_1.0/OpenRGBE131ReceiverPlugin_1.0_Trixie_amd64_4900d20.deb)
      url: ORGB_PLUGIN_URL(amd64,E131RecieverPlugin,E131_PL_COMMIT)
      checksum: 21e439349150dfdb6c75f69a67fdc0f1afcdcacbe99908a69e487b75078a7000
      only-arches: [amd64]
    - type: file
      url: ORGB_PLUGIN_URL(arm64,E131RecieverPlugin,E131_PL_COMMIT)
      checksum: 51c2807aed19c70d25722d73b04101e6507af2263d058d5835fe039532d0c164
      only-arches: [arm64]

  commands:
    - mkdir -p /usr/lib/openrgb
    - mkdir -p /usr/lib/openrgb/plugins
    - rm -rf "/usr/lib/openrgb/plugins/*"
    - ARCH=$(dpkg --print-architecture)
    - PLUGIN_APT_INSTALL(EffectsPlugin,EFFECTS_PL_COMMIT)
    - PLUGIN_APT_INSTALL(VisualMapPlugin,VISUALMAP_PL_COMMIT)
    - PLUGIN_APT_INSTALL(HardwareSyncPlugin,HARDWARESYNC_PL_COMMIT)
    - PLUGIN_APT_INSTALL(E131RecieverPlugin,E131_PL_COMMIT)
