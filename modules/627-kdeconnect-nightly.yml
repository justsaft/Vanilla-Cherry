
name: kdeconnect-nightly-install
type: shell
sources:
  - type: tar
    url: https://github.com/justsaft/vos-ci-building/releases/download/kdeconnect-nightly/kdeconnect-nightly-amd64.tar.gz
    checksum: 71840daea318e1e4abd36bdfc6bf4e6660910683def1b13cb71bf4fdb6ae7a4e
    only-arches: [amd64]
  - type: tar
    url: https://github.com/justsaft/vos-ci-building/releases/download/kdeconnect-nightly/kdeconnect-nightly-arm64.tar.gz
    checksum: 63f9a69d1e64c925f3d37cfa3f1522c9d1d7b69e64682d8f7e224ccf1fd2bdb8
    only-arches: [arm64]

  - type: tar
    url: https://github.com/justsaft/vos-ci-building/releases/download/libei-1.6.0/libei-1.6.0-amd64.tar.gz
    checksum: 4f29a328fcddd64437ce672cb474629557befe66b6096d5b769d7acbfed457a5
    only-arches: [amd64]
  - type: tar
    url: https://github.com/justsaft/vos-ci-building/releases/download/libei-1.6.0/libei-1.6.0-arm64.tar.gz
    checksum: bf1843f08761b4abac3619d294ccd19b8b20016a3877df476f4501976d13f863
    only-arches: [arm64]

  - type: file
    url: https://github.com/KDE/kdeconnect-kde/blob/master/daemon/org.kde.kdeconnect.service.in
  - type: file
    url: https://github.com/KDE/kdeconnect-kde/blob/master/daemon/org.kde.kdeconnect.daemon.desktop.cmake

commands:
  - ARCH=$(dpkg --print-architecture)
  - KDECONNECT_INSTALL_PREFIX=/usr/local
  - cp -r /sources/kdeconnect-nightly-install/kdeconnect-nightly-${ARCH}/* ${KDECONNECT_INSTALL_PREFIX}
  - KDECONNECT_DBUS_DAEMON_FILE=/sources/kdeconnect-nightly-install/org.kde.kdeconnect.service/kdeconnect-nightly-install.in
  - KDECONNECT_DESKTOP_FILE=/sources/kdeconnect-nightly-install/org.kde.kdeconnect.daemon.desktop/kdeconnect-nightly-install.cmake
  - sed -i "s|@KDE_INSTALL_FULL_BINDIR@|$KDECONNECT_INSTALL_PREFIX/bin|g" ${KDECONNECT_DBUS_DAEMON_FILE}
  - sed -i "s|@kdeconnectd_prefix@|$KDECONNECT_INSTALL_PREFIX/bin/|g" ${KDECONNECT_DESKTOP_FILE}
  - cp ${KDECONNECT_DESKTOP_FILE} /usr/share/applications/
  - cp ${KDECONNECT_DESKTOP_FILE} /etc/xdg/autostart/
  - cp ${KDECONNECT_DBUS_DAEMON_FILE} /usr/local/share/dbus-1/system-services

modules:
- name: kdeconnect-additional-tools
  type: apt
  sources:
    - packages:
      - krdc
      - krdp

