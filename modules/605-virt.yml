name: virt-qemu-system
type: shell
commands:
  - ARCH=$(dpkg --print-architecture)
  # Debian names the packages after the CPU family, not the dpkg architecture
  - case "$ARCH" in amd64) QEMU_ARCH=x86 ;; arm64) QEMU_ARCH=arm ;; *) echo "unsupported architecture $ARCH" >&2; exit 1 ;; esac
  - apt install -qq -y --no-install-recommends qemu-system-${QEMU_ARCH}

modules:
- name: virt-packages
  type: apt
  sources:
    - packages:
      - qemu-system-common
      - qemu-system-misc
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - dnsmasq-base
      - bridge-utils
      - ovmf
      - swtpm
      - swtpm-tools